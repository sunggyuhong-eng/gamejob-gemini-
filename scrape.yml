name: 게임잡 채용공고 자동 수집 및 AI 딥 분석

on:
  schedule:
    # 매달 1일 00:00 UTC (한국 시간 오전 9:00) 자동 실행
    - cron: '0 0 1 * *'
  workflow_dispatch: {} # 수동 테스트용 버튼

permissions:
  contents: write

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 크롤링 및 Gemini AI 딥다이브 분석 자동 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gamejob_tracker.py --run

      - name: 분석 결과 자동 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [자동업데이트] 채용 데이터 수집 및 AI 딥다이브 리포트 생성 ($(date +'%Y-%m-%d'))"
          file_pattern: "data/**"
