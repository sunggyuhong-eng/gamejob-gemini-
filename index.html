<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임잡 채용 트래커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{ --bg:#ffffff; --surface:#f7f8fa; --surface-2:#f2f3f5; --border:#eaebee; --text:#191f28; --muted:#8b95a1; --blue:#3182f6; --blue-soft:#eef4ff; --up:#f04452; --up-soft:#fef0f1; --down:#3182f6; --down-soft:#eef4ff; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;font-size:14.5px;}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 20px 100px;}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .header-logo{height:26px;width:auto;vertical-align:middle;}
  .header-title{display:flex;align-items:center;gap:10px;}
  .upload-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .empty{text-align:center;padding:120px 20px;color:var(--muted);}
  .empty strong{color:var(--text);display:block;font-size:17px;margin-bottom:8px;font-weight:700;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .stat-card{background:var(--surface);border-radius:12px;padding:14px 16px;}
  .stat-card .label{color:var(--muted);font-size:12px;font-weight:500;margin-bottom:4px;}
  .stat-card .num{font-size:21px;font-weight:700;}
  .stat-card .num.up{color:var(--up);} .stat-card .num.down{color:var(--down);}
  @media (max-width:640px){.stat-row{grid-template-columns:1fr;}}
  .nav-tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
  .nav-tab{background:none;border:none;padding:11px 0;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .nav-tab.active{color:var(--text);border-bottom-color:var(--text);}
  .view{display:none;} .view.active{display:block;}
  .panel{background:var(--surface);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
  .panel-title{font-size:13.5px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .panel-title .see-all{font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:760px){.grid-2{grid-template-columns:1fr;}}
  canvas{max-width:100%;}
  .search-input{width:100%;padding:10px 13px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13.5px;margin-bottom:10px;}
  .sort-chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .chip{background:var(--surface-2);border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
  .chip.active{background:var(--text);color:#fff;}
  table.rank{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;}
  table.rank th{text-align:right;color:var(--muted);font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--border);}
  table.rank th:first-child, table.rank th:nth-child(2){text-align:left;}
  table.rank td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle;overflow:hidden;}
  table.rank th:nth-child(1), table.rank td:nth-child(1){width:30px;text-align:center;}
  table.rank th:nth-child(2), table.rank td:nth-child(2){width:auto;}
  table.rank th:nth-child(3), table.rank td:nth-child(3){width:70px;}
  table.rank th:nth-child(4), table.rank td:nth-child(4){width:56px;}
  table.rank th:nth-child(5), table.rank td:nth-child(5){width:120px;}
  table.rank td.name-cell{text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  table.rank tbody tr{cursor:pointer;} table.rank tbody tr:hover{background:#fff;} table.rank tbody tr.selected{background:var(--blue-soft);}
  .delta-up{color:var(--up);font-weight:700;} .delta-down{color:var(--down);font-weight:700;} .delta-flat{color:#b0b8c1;} .delta-new{color:var(--up);font-weight:700;font-size:11.5px;}
  .row-count{color:var(--muted);font-size:11.5px;margin-top:8px;}
  .detail-panel{background:var(--surface);border-radius:14px;padding:18px;margin-bottom:16px;display:none;}
  .detail-panel.show{display:block;}
  .dp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .dp-title{font-size:17px;font-weight:700;} .dp-count{font-size:20px;font-weight:700;} .dp-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .dp-close{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-weight:600;}
  .dp-back{background:none;border:none;color:var(--blue);font-size:13px;cursor:pointer;font-weight:700;padding:0;}
  .dp-homepage-btn{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--text);text-decoration:none;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin-top:16px;}
  .info-item-wide{grid-column:1 / -1;} .info-label{font-size:12px;color:var(--muted);margin-bottom:3px;} .info-value{font-size:14.5px;font-weight:700;color:var(--text);}
  .stock-section{margin-top:26px;} .stock-section h3{font-size:14px;font-weight:700;margin:0 0 12px;}
  .donut-section{display:flex;gap:24px;align-items:center;flex-wrap:wrap;} .donut-canvas-wrap{width:150px;height:150px;flex-shrink:0;}
  .donut-legend{flex:1;min-width:180px;} .donut-legend-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .donut-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-top:10px;}
  .podium-item{background:var(--surface-2);border-radius:12px;padding:14px 10px;text-align:center;flex:1;max-width:150px;}
  .podium-item.first{background:#fff7e0;border:2px solid #f2b84b;padding-top:20px;padding-bottom:18px;transform:translateY(-8px);}
  .podium-medal{font-size:26px;line-height:1;} .podium-item.first .podium-medal{font-size:32px;}
  .podium-name{font-weight:700;font-size:12.5px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .podium-count{font-size:12px;color:var(--muted);margin-top:3px;}
  .insight-panel{background:var(--blue-soft);} .insight-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
  .insight-list li{font-size:13.5px;line-height:1.5;padding-left:20px;position:relative;} .insight-list li::before{content:'•';position:absolute;left:4px;color:var(--blue);font-weight:700;}
  .insight-list b{font-weight:700;} .insight-list .up-text{color:var(--up);font-weight:700;} .insight-list .down-text{color:var(--down);font-weight:700;}
  .detail-jobs .dj-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .dj-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;} .dj-meta{color:var(--muted);font-size:11.5px;flex-shrink:0;}
  .placeholder-hint{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .report-card-list{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
  .report-item-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .report-item-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(49,130,246,0.08);transform:translateY(-1px);}
  .report-item-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;} .report-item-sub{font-size:12.5px;color:var(--muted);}
  .report-badge{background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s ease;}
  .modal-overlay.active{opacity:1;pointer-events:auto;}
  .modal-container{background:#fff;width:100%;max-width:780px;max-height:85vh;border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,0.18);display:flex;flex-direction:column;overflow:hidden;}
  .modal-header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#fff;gap:12px;}
  .modal-title{font-size:16px;font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modal-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .modal-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;}
  .modal-btn-blue{background:var(--blue);color:#fff;border:none;}
  .modal-close-btn{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;font-weight:700;padding:0 4px;}
  .modal-body{padding:22px;overflow-y:auto;line-height:1.7;font-size:14px;color:#333d4b;}
  .ai-section-card{background:var(--surface);border-radius:12px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--border);}
  .ai-section-title{font-size:15px;font-weight:700;color:var(--text);margin:0 0 10px 0;}
  .ai-section-body{font-size:13.5px;line-height:1.7;color:#333d4b;} .ai-section-body ul{margin:6px 0;padding-left:18px;} .ai-section-body b{color:var(--text);background:#eef4ff;padding:1px 5px;border-radius:4px;}
  .manual-generate-box{margin-bottom:16px;background:var(--blue-soft);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .manual-generate-text{font-size:13px;font-weight:600;color:var(--text);} .manual-generate-btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-title"><img src="https://i.gamejob.co.kr/pc/images/gamejob_share.png" alt="GAMEJOB" class="header-logo"><h1>게임잡 채용 트래커</h1></div>
  </header>
  <div id="emptyState" class="empty"><strong>데이터를 불러오는 중이에요...</strong></div>
  <div id="content" style="display:none;">
    <div class="stat-row" id="statRow"></div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-view="home">홈</button>
      <button class="nav-tab" data-view="company">기업별</button>
      <button class="nav-tab" data-view="category">공고별</button>
      <button class="nav-tab" data-view="employment">고용형태별</button>
      <button class="nav-tab" data-view="report">월별 리포트</button>
    </div>
    <div class="view active" id="view-home">
      <div class="panel" id="homeTrendPanel" style="display:none;"><div class="panel-title">월별 전체 공고 수 추이</div><canvas id="trendChart" height="70"></canvas></div>
      <div class="grid-2">
        <div class="panel"><div class="panel-title">공고 많은 직무 TOP 10 <span class="see-all" data-goto="category">전체보기</span></div><table class="rank" id="homeCategoryTable"><thead><tr><th></th><th>직무</th><th>추이</th><th>공고</th><th>전월대비</th></tr></thead><tbody></tbody></table></div>
        <div class="panel"><div class="panel-title">공고 많은 기업 TOP 10 <span class="see-all" data-goto="company">전체보기</span></div><table class="rank" id="homeCompanyTable"><thead><tr><th></th><th>기업</th><th>추이</th><th>공고</th><th>전월대비</th></tr></thead><tbody></tbody></table></div>
      </div>
      <div class="panel insight-panel" id="insightPanel" style="display:none;"><div class="panel-title">📝 이번 달 채용 트렌드 요약</div><ul class="insight-list" id="insightList"></ul></div>
    </div>
    <div class="view" id="view-company">
      <div class="detail-panel" id="companyDetail"></div>
      <div id="companyListSection">
        <input type="text" class="search-input" id="companySearch" placeholder="기업명 검색...">
        <div class="sort-chips" data-kind="company"><button class="chip active" data-sort="count">공고 많은순</button><button class="chip" data-sort="increase">증가순</button><button class="chip" data-sort="decrease">감소순</button><button class="chip" data-sort="name">이름순</button></div>
        <table class="rank" id="companyRankTable"><thead><tr><th></th><th>기업</th><th>추이</th><th>공고</th><th>전월대비</th></tr></thead><tbody id="companyRankBody"></tbody></table>
      </div>
    </div>
    <div class="view" id="view-category">
      <div class="detail-panel" id="categoryDetail"></div>
      <input type="text" class="search-input" id="categorySearch" placeholder="직무 검색...">
      <div class="sort-chips" data-kind="category"><button class="chip active" data-sort="count">공고 많은순</button><button class="chip" data-sort="increase">증가순</button><button class="chip" data-sort="decrease">감소순</button><button class="chip" data-sort="name">이름순</button></div>
      <table class="rank" id="categoryRankTable"><thead><tr><th></th><th>직무</th><th>추이</th><th>공고</th><th>전월대비</th></tr></thead><tbody id="categoryRankBody"></tbody></table>
    </div>
    <div class="view" id="view-employment">
      <div class="detail-panel" id="employmentDetail"></div>
      <div class="panel"><div class="panel-title">고용형태별 비율</div><div class="donut-section"><div class="donut-canvas-wrap"><canvas id="employmentDonutCanvas"></canvas></div><div class="donut-legend" id="employmentDonutLegend"></div></div></div>
      <table class="rank" id="employmentRankTable"><thead><tr><th></th><th>고용형태</th><th>추이</th><th>공고</th><th>전월대비</th></tr></thead><tbody id="employmentRankBody"></tbody></table>
    </div>
    <div class="view" id="view-report">
      <div class="panel"><div class="panel-title">📅 월별 AI 분석 리포트 보관함</div><div id="reportListContainer"><div class="placeholder-hint">스냅샷 데이터를 확인하고 있어요...</div></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">월별 분석 리포트</div>
      <div class="modal-actions"><button class="modal-btn modal-btn-blue" onclick="downloadReport()">📥 다운로드</button><button class="modal-btn" onclick="shareReport()">🔗 공유하기</button><button class="modal-close-btn" onclick="closeReportModal()">✕</button></div>
    </div>
    <div class="modal-body" id="modalBody"><div class="placeholder-hint">불러오는 중입니다...</div></div>
  </div>
</div>

<script>
let snapshots = []; let charts = {}; let selected = {company:null, category:null, employment:null}; let sortStateByKind = {company:'count', category:'count', employment:'count'};
let currentReportData = { date: '', title: '', text: '', snapIndex: null };

async function tryAutoLoad(){
  const host = window.location.hostname; const pathParts = window.location.pathname.split('/').filter(Boolean);
  if(!host.endsWith('github.io') || !pathParts.length) return false;
  const owner = host.split('.')[0], repo = pathParts[0];
  try{
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data/snapshots`, {cache:'no-store'});
    if(!res.ok) return false;
    const items = await res.json(); const csvFiles = items.filter(it => it.name.endsWith('.csv'));
    if(!csvFiles.length) return false;
    const parsed = await Promise.all(csvFiles.map(async (it)=>{
      const r = await fetch(it.download_url, {cache:'no-store'}); if(!r.ok) return null;
      const text = await r.text(), dateMatch = it.name.match(/(\d{4}-\d{2}-\d{2})/);
      return {date: dateMatch ? dateMatch[1] : it.name, jobs: Papa.parse(text, {header:true, skipEmptyLines:true}).data.filter(row=>row.gi_no)};
    }));
    snapshots = parsed.filter(Boolean).sort((a,b)=> a.date.localeCompare(b.date));
    render(); return true;
  }catch(err){ return false; }
}

window.addEventListener('DOMContentLoaded', async ()=>{
  if(!(await tryAutoLoad())) document.getElementById('emptyState').innerHTML = '<strong>데이터를 불러올 수 없어요.</strong> 깃허브 Actions 실행을 확인해주세요.';
});

function escapeHtml(s){ return s==null?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jobCategories(j){ return j.job_categories&&j.job_categories.trim() ? j.job_categories.split(';').map(s=>s.trim()).filter(Boolean) : [j.job_function || '기타/미분류']; }

const GROUP_INFO = [['개발','💻',['클라이언트','서버','엔진','AI 개발','플랫폼','인프라','프로그래','개발자','백엔드','프론트']],['아트','🎨',['디자인','원화','모델링','애니메이션','이펙트','그래픽','아트','일러스트','사운드','영상']],['QA','🧪',['QA','테스트','운영','고객','커뮤니티']],['사업','📈',['사업','마케팅','홍보','영업','BD','퍼블리싱','전략']],['기획','📋',['기획','시나리오','레벨디자인','밸런스']]];
const GROUP_ORDER = ['개발','아트','기획','QA','사업','지원부서'];
function classifyBroadGroup(s){ for(const [g, e, kws] of GROUP_INFO){ if(kws.some(kw=>s.includes(kw))) return [g, e]; } return ['지원부서', '🗂️']; }
function categoryLabel(n){ return `${classifyBroadGroup(n)[1]} ${n}`; }
function employmentBucket(j){ const t=j.employment_type||''; return t.includes('정규')?'정규직':(t.includes('계약')?'계약직':(t.includes('인턴')?'인턴직':(t.includes('파견')?'파견직':'기타'))); }

const KEY_FNS = {company:j=>[j.company_name].filter(Boolean), category:jobCategories, employment:j=>[employmentBucket(j)]};

function render(){
  document.getElementById('emptyState').style.display='none'; document.getElementById('content').style.display='block';
  setupNav(); renderStats(); renderHomeTrend(); ['company','category','employment'].forEach(buildEntityState);
  renderHomeRankings(); setupEntityView('company'); setupEntityView('category'); renderEmploymentView(); renderInsightSummary(); renderReportView();
}

function setupNav(){
  document.querySelectorAll('.nav-tab').forEach(b=>b.onclick=()=>{
    const v=b.dataset.view; if(['company','category','employment'].includes(v)&&selected[v]){ selected[v]=null; if(v!=='employment') drawEntityTable(v); else renderEmploymentView(); drawDetail(v); }
    document.querySelectorAll('.nav-tab').forEach(x=>x.classList.toggle('active',x===b)); document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));
  });
  document.querySelectorAll('.see-all').forEach(el=>el.onclick=()=>document.querySelector(`.nav-tab[data-view="${el.dataset.goto}"]`).click());
}

function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }

function renderStats(){
  const latest=snapshots[snapshots.length-1], prev=snapshots.length>1?snapshots[snapshots.length-2]:null;
  let nc=null, rc=null;
  if(prev){ const pIds=new Set(prev.jobs.map(j=>j.gi_no)), cIds=new Set(latest.jobs.map(j=>j.gi_no)); nc=latest.jobs.filter(j=>!pIds.has(j.gi_no)).length; rc=prev.jobs.filter(j=>!cIds.has(j.gi_no)).length; }
  document.getElementById('statRow').innerHTML=`<div class="stat-card"><div class="label">전체 공고 (${latest.date})</div><div class="num">${latest.jobs.length}</div></div><div class="stat-card"><div class="label">신규 등록</div><div class="num ${nc!=null?'up':''}">${nc!=null?'+'+nc:'—'}</div></div><div class="stat-card"><div class="label">삭제 / 마감</div><div class="num ${rc!=null?'down':''}">${rc!=null?'-'+rc:'—'}</div></div>`;
}

function renderHomeTrend(){
  const p=document.getElementById('homeTrendPanel'); if(snapshots.length<2){ p.style.display='none'; return; } p.style.display='block'; destroyChart('trend');
  charts.trend = new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:snapshots.map(s=>s.date),datasets:[{data:snapshots.map(s=>s.jobs.length),borderColor:'#3182f6',backgroundColor:'rgba(49,130,246,0.08)',fill:true,tension:0.3,pointRadius:3}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}});
}

const entityState={};
function buildEntityState(kind){
  const map={}, infoMap={};
  snapshots.forEach((snap, idx)=>{
    const counts={}; snap.jobs.forEach(j=>{ KEY_FNS[kind](j).forEach(k=>{ if(k) counts[k]=(counts[k]||0)+1; }); if(kind==='company'&&j.company_name&&!infoMap[j.company_name]) infoMap[j.company_name]={logo:j.company_logo_url}; });
    Object.keys(counts).forEach(k=>{ if(!map[k]) map[k]=new Array(snapshots.length).fill(0); map[k][idx]=counts[k]; });
  });
  entityState[kind] = Object.keys(map).map(name=>{ const series=map[name], latest=series[series.length-1], prev=series.length>1?series[series.length-2]:null, delta=prev!=null?latest-prev:null; return {name, series, latest, delta, logo:infoMap[name]?.logo}; });
}

function sortEntries(arr, sk){ const a=[...arr]; if(sk==='count') a.sort((x,y)=>y.latest-x.latest); else if(sk==='increase') a.sort((x,y)=>(y.delta??-9999)-(x.delta??-9999)); else if(sk==='decrease') a.sort((x,y)=>(x.delta??9999)-(y.delta??9999)); else a.sort((x,y)=>x.name.localeCompare(y.name)); return a; }
function logoImg(e){ return e.logo?`<img src="${escapeHtml(e.logo)}" width="20" height="20" style="border-radius:4px;object-fit:contain;margin-right:8px;vertical-align:middle;border:1px solid var(--border)">`:''; }
function deltaHtml(e){ if(e.delta==null) return '<span class="delta-flat">—</span>'; return `<span class="${e.delta>0?'delta-up':(e.delta<0?'delta-down':'delta-flat')}">${e.delta>0?'▲ +':(e.delta<0?'▼ ':'')}${e.delta}</span>`; }
function renderRankRows(tb, entries, kind, limit, nav){
  tb.innerHTML = (limit?entries.slice(0,limit):entries).map((e,i)=>`<tr class="${selected[kind]===e.name?'selected':''}" onclick="selectEntity('${kind}','${escapeHtml(e.name).replace(/'/g,"\\'")}',${nav})"><td>${i+1}</td><td class="name-cell" style="display:flex;align-items:center;">${kind==='company'?logoImg(e):''}<span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(kind==='category'?categoryLabel(e.name):e.name)}</span></td><td></td><td>${e.latest}</td><td>${deltaHtml(e)}</td></tr>`).join('');
}
function selectEntity(k,n,nav){ selected[k]=nav?n:(selected[k]===n?null:n); if(nav) document.querySelector(`.nav-tab[data-view="${k}"]`).click(); else{ renderHomeRankings(); if(k==='employment') renderEmploymentView(); else drawEntityTable(k); drawDetail(k); } }

function renderHomeRankings(){ renderRankRows(document.querySelector('#homeCategoryTable tbody'), sortEntries(entityState.category,'count'), 'category', 10, true); renderRankRows(document.querySelector('#homeCompanyTable tbody'), sortEntries(entityState.company,'count'), 'company', 10, true); }
function setupEntityView(k){ document.getElementById(k+'Search').oninput=()=>drawEntityTable(k); document.querySelectorAll(`.sort-chips[data-kind="${k}"] .chip`).forEach(c=>c.onclick=()=>{ document.querySelectorAll(`.sort-chips[data-kind="${k}"] .chip`).forEach(x=>x.classList.remove('active')); c.classList.add('active'); sortStateByKind[k]=c.dataset.sort; drawEntityTable(k); }); drawEntityTable(k); }
function drawEntityTable(k){ const q=document.getElementById(k+'Search').value.trim().toLowerCase(); const ents=sortEntries(entityState[k].filter(e=>e.name.toLowerCase().includes(q)), sortStateByKind[k]); renderRankRows(document.getElementById(k+'RankBody'), ents, k, null, false); document.getElementById(k+'RowCount')&&(document.getElementById(k+'RowCount').textContent=`${ents.length}개`); }

function computeStats(idx){
  if(snapshots.length<2) return null; const cur=snapshots[idx??snapshots.length-1], prv=snapshots[(idx??snapshots.length-1)-1];
  const gc=(js)=>{ const c={}; GROUP_ORDER.forEach(g=>c[g]=0); js.forEach(j=>{ new Set(jobCategories(j).map(x=>classifyBroadGroup(x)[0])).forEach(g=>c[g]++); }); return c; };
  const cg=gc(cur.jobs), pg=gc(prv.jobs); const gd=GROUP_ORDER.map(g=>({g, cur:cg[g], prev:pg[g], delta:cg[g]-pg[g]}));
  const cp=sortEntries(entityState.company.filter(e=>e.series[idx??snapshots.length-1]!=null),'increase');
  return { date:cur.date, prevDate:prv.date, latestTotal:cur.jobs.length, totalDelta:cur.jobs.length-prv.jobs.length, groupDeltas:gd, compGain:cp[0]?{name:cp[0].name, delta:cp[0].delta}:null, compDrop:cp[cp.length-1]?{name:cp[cp.length-1].name, delta:cp[cp.length-1].delta}:null };
}

function renderInsightSummary(){ const p=document.getElementById('insightPanel'), st=computeStats(); if(!st){ p.style.display='none'; return; } p.style.display='block'; document.getElementById('insightList').innerHTML=`<li>전체 공고 수는 <b>${st.latestTotal}건</b> (전월대비 ${st.totalDelta>0?'+':''}${st.totalDelta}건)입니다.</li><li>${st.compGain?`가장 채용이 많이 늘어난 기업은 <b>${st.compGain.name}</b> (+${st.compGain.delta}건)`:'데이터 부족'}입니다.</li>`; }

function renderEmploymentView(){ const ents=sortEntries(entityState.employment,'count'); renderRankRows(document.getElementById('employmentRankBody'), ents, 'employment', null, false); }
function drawDetail(k){ const p=document.getElementById(k+'Detail'); if(!selected[k]){ p.classList.remove('show'); return; } p.classList.add('show'); const e=entityState[k].find(x=>x.name===selected[k]); p.innerHTML=`<div class="dp-head"><div class="dp-title">${escapeHtml(k==='category'?categoryLabel(e.name):e.name)}</div><button class="dp-close" onclick="selectEntity('${k}','${escapeHtml(e.name).replace(/'/g,"\\'")}',false)">닫기 ✕</button></div><div class="dp-count">${e.latest}건</div>`; }

function renderReportView(){
  const c=document.getElementById('reportListContainer'); if(snapshots.length<2){ c.innerHTML='<div class="placeholder-hint">다음 달부터 리포트 보관함이 활성화돼요.</div>'; return; }
  c.innerHTML = '<div class="report-card-list">' + snapshots.slice(1).map((cur, i)=>{ const d=cur.date.split('-'); return `<div class="report-item-card" onclick="openReportModal(${i+1})"><div><div class="report-item-title">📄 ${d[0]}년 ${parseInt(d[1])}월 채용 트렌드 리포트</div><div class="report-item-sub">기준일: ${cur.date} · ${cur.jobs.length}건</div></div><div class="report-badge">열기 ↗</div></div>`; }).reverse().join('') + '</div>';
}

async function openReportModal(idx){
  document.getElementById('reportModal').classList.add('active'); const body=document.getElementById('modalBody'); const cur=snapshots[idx], st=computeStats(idx);
  currentReportData = { date: cur.date, title: `${cur.date} 월간 AI 채용 분석 리포트`, text: '', snapIndex: idx };
  document.getElementById('modalTitle').textContent = currentReportData.title;
  try{ const r=await fetch(`data/reports/${cur.date}_ai_analysis.md`,{cache:'no-store'}); if(r.ok){ const t=await r.text(); currentReportData.text=t; body.innerHTML=parseMd(t); return; } }catch(e){}
  
  // 버튼 클릭 시 Claude API 연동 함수(triggerBrowserClaudeAnalysis) 호출하도록 변경
  body.innerHTML=`<div class="manual-generate-box"><div><div class="manual-generate-text">💡 깃허브 서버의 AI 리포트 파일이 아직 없습니다.<br>브라우저에서 직접 최신 Claude 모델로 딥 분석을 실행해 보세요.</div></div><button class="manual-generate-btn" onclick="triggerBrowserClaudeAnalysis(${idx})">🤖 AI 딥 분석 직접 생성</button></div>`;
}

function parseMd(t){ return t.split(/(?=\n###? )/g).map(s=>{ const b=s.trim().split('\n'), ti=b[0].startsWith('#')?b.shift().replace(/^#+\s*/,''):''; const bh=b.join('<br>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/^\s*[\-\*]\s+(.*)$/gim,'<li>$1</li>').replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>'); return ti?`<div class="ai-section-card"><div class="ai-section-title">${escapeHtml(ti)}</div><div class="ai-section-body">${bh}</div></div>`:`<div class="ai-section-body">${bh}</div>`; }).join(''); }

/* 수동 브라우저 Claude AI 리포트 생성 함수 */
async function triggerBrowserClaudeAnalysis(snapIndex){
  let key = localStorage.getItem('claude_api_key');
  
  if(!key || key.length < 10){
    key = window.prompt('Claude API 키를 입력하세요 (sk-ant-api... 발급).\n브라우저에 안전하게 저장됩니다.');
    if(key) {
      key = key.trim();
      localStorage.setItem('claude_api_key', key);
    }
  }
  if(!key) return;

  const stats = computeStats(snapIndex);
  const bodyEl = document.getElementById('modalBody');

  bodyEl.innerHTML = '<div class="placeholder-hint">🔍 <b>Claude 3.5 Sonnet</b>이 실시간 채용 트렌드를 분석 중입니다... (약 10~15초 소요)</div>';

  const prompt = `너는 게임 산업 전문 수석 애널리스트야.
아래 실시간 수집 데이터를 결합하여 심층 리포트를 작성해줘.

[데이터 기준: ${stats.date}]
- 전체 공고 수: 이번달 ${stats.latestTotal}건 (전월 대비 ${stats.totalDelta>=0?'+':''}${stats.totalDelta}건)
- 공고 증가 1위 기업: ${stats.compGain ? stats.compGain.name : '없음'}
- 공고 감소 1위 기업: ${stats.compDrop ? stats.compDrop.name : '없음'}

[작성 가이드]
### 📊 1. 게임 시장 거시 동향 & 직군별 수요 원인 분석
### 📰 2. 주요 기업 변동 원인 & 프로젝트 딥다이브
### 💡 3. 채용 시장 시사점 & 기술 스택 전망

위 3개 섹션 구조로 구체적인 기술 스택, 업계 원인을 밝혀서 작성해줘. 핵심 키워드는 **볼드체**로 강조해줘.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'claude-3-5-sonnet-20241022',
        max_tokens: 4000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if(!res.ok){
      const errJson = await res.json().catch(()=>({}));
      const msg = errJson.error?.message || res.statusText;
      localStorage.removeItem('claude_api_key');
      bodyEl.innerHTML = `
        <div class="placeholder-hint" style="color:var(--up);">
          ⚠️ API 호출 실패 (${res.status}): ${escapeHtml(msg)}<br>
          <button class="manual-generate-btn" style="margin-top:10px;" onclick="triggerBrowserClaudeAnalysis(${snapIndex})">🔑 API 키 재입력 후 다시 시도</button>
        </div>`;
      return;
    }

    const data = await res.json();
    const text = data.content?.[0]?.text;

    if(text){
      currentReportData.text = `# ${currentReportData.title}\n\n` + text;
      bodyEl.innerHTML = parseMd(text);
    } else {
      bodyEl.innerHTML = '<div class="placeholder-hint">응답 데이터를 생성하지 못했습니다.</div>';
    }
  } catch(err) {
    bodyEl.innerHTML = `<div class="placeholder-hint">네트워크 오류: ${err.message}</div>`;
  }
}

function closeReportModal(){ document.getElementById('reportModal').classList.remove('active'); }
function downloadReport(){ if(!currentReportData.text) return alert('내용이 없습니다.'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([currentReportData.text],{type:'text/markdown'})); a.download=`${currentReportData.date}_리포트.md`; a.click(); }
function shareReport(){ navigator.clipboard.writeText(window.location.href).then(()=>alert('복사되었습니다.')); }
</script>
